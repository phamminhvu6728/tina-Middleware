version: '3.8'

services:
  topcv-ocr-middleware:
    build:
      context: .
      dockerfile: Dockerfile
    image: topcv-ocr-middleware:latest
    container_name: topcv-ocr-middleware
    restart: always
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - PORT=8000
      - HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
