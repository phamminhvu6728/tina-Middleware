services:
  topcv-ocr-middleware:
    image: ghcr.io/phamminhvu6728/tina-middleware:latest
    container_name: topcv-ocr-middleware
    restart: always
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      # Để trống để middleware tự suy ra public base URL từ X-Forwarded-* của Nginx.
      # Chỉ đặt khi muốn ép một domain cụ thể.
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
      - TMP_CV_DIR=/var/lib/tina-middleware-cv
      - CV_LINK_TTL_SECONDS=${CV_LINK_TTL_SECONDS:-60}
      - CV_MAX_CACHED_FILES=${CV_MAX_CACHED_FILES:-10}
      - CV_MAX_WORKERS=${CV_MAX_WORKERS:-10}
    volumes:
      - cv-cache:/var/lib/tina-middleware-cv
    networks:
      - default
      - tina-shared
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  tina-shared:
    external: true

volumes:
  cv-cache:
